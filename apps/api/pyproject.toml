[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persona-studio-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.4.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
