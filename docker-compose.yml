version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-persona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-persona_secret}
      POSTGRES_DB: ${POSTGRES_DB:-persona_studio}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-persona} -d ${POSTGRES_DB:-persona_studio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-persona}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-persona_secret}
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-persona}:${POSTGRES_PASSWORD:-persona_secret}@postgres:5432/${POSTGRES_DB:-persona_studio}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-persona}:${POSTGRES_PASSWORD:-persona_secret}@postgres:5432/${POSTGRES_DB:-persona_studio}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-persona}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-persona_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-persona-studio}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PROVIDER_REGISTRY: ${PROVIDER_REGISTRY:-mock}
      COMFYUI_URL: ${COMFYUI_URL:-}
      WAN_VIDEO_URL: ${WAN_VIDEO_URL:-}
      WAN_API_KEY: ${WAN_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      GPU_WORKER_URL: ${GPU_WORKER_URL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-persona}:${POSTGRES_PASSWORD:-persona_secret}@postgres:5432/${POSTGRES_DB:-persona_studio}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-persona}:${POSTGRES_PASSWORD:-persona_secret}@postgres:5432/${POSTGRES_DB:-persona_studio}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-persona}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-persona_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-persona-studio}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PROVIDER_REGISTRY: ${PROVIDER_REGISTRY:-mock}
      COMFYUI_URL: ${COMFYUI_URL:-}
      WAN_VIDEO_URL: ${WAN_VIDEO_URL:-}
      WAN_API_KEY: ${WAN_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      GPU_WORKER_URL: ${GPU_WORKER_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
